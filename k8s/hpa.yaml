apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-app
  labels:
    app: food-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-app
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 90
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
