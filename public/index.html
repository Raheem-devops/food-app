<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food App</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#f6f4ee;color:#14202b}
  header{background:#14202b;color:#f6f4ee;padding:32px 24px}
  header h1{margin:0 0 8px}
  header p{margin:0;color:#c9d3da}
  main{max-width:900px;margin:32px auto;padding:0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{background:#fff;border:1px solid #d9d6cc;border-radius:14px;padding:24px}
  .card h2{margin:0 0 8px;font-size:22px}
  .tag{display:inline-block;background:#e8602c;color:#fff;border-radius:20px;padding:4px 12px;font-size:14px}
  .rating{margin-top:12px;font-weight:bold}
  footer{text-align:center;color:#6a7179;padding:24px}
</style>
</head>
<body>
<header>
  <h1>Food App</h1>
  <p>Restaurants served by a Node.js API running on Kubernetes</p>
</header>
<main>
  <div class="grid" id="list">Loading restaurants...</div>
</main>
<footer id="ver"></footer>
<script>
fetch('/api/restaurants').then(r => r.json()).then(data => {
  const list = document.getElementById('list');
  list.textContent = '';
  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const h2 = document.createElement('h2');
    h2.textContent = item.name;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = item.cuisine;
    const rating = document.createElement('div');
    rating.className = 'rating';
    rating.textContent = 'Rating: ' + item.rating + ' / 5';
    card.append(h2, tag, rating);
    list.append(card);
  });
}).catch(() => {
  document.getElementById('list').textContent = 'Could not load restaurants.';
});
fetch('/version').then(r => r.json()).then(v => {
  document.getElementById('ver').textContent = 'Version ' + v.version;
});
</script>
</body>
</html>
